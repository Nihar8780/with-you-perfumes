<body>

    <div class="loader-logo">

        WITH YOU

    </div>

</div>

<!-- HEADER -->

<header class="header fixed-top">

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                <img src="assets/images/logo.png"
                     alt="WITH YOU"
                     height="50">

            </a>

            <button class="navbar-toggler"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">

                <i class="fas fa-bars"></i>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarMenu">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="index.html">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="shop.html">

                            Shop

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="about.html">

                            About

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="contact.html">

                            Contact

                        </a>

                    </li>

                </ul>

                <div class="d-flex gap-3">

                    <a href="wishlist.html">

                        <i class="far fa-heart"></i>

                    </a>

                    <a href="cart.html">

                        <i class="fas fa-shopping-bag"></i>

                    </a>

                </div>

            </div>

        </div>

    </nav>

</header>

<!-- PAGE HERO -->

<section class="page-hero">

    <div class="container text-center">

        <h1>

            Secure Checkout

        </h1>

        <p>

            Complete your purchase securely.

        </p>

    </div>

</section>

<!-- CHECKOUT -->

<section class="checkout-section py-5">

    <div class="container">

        <div class="row g-5">

            <!-- Billing Form -->

            <div class="col-lg-7">

                <div class="checkout-card">

                    <h3 class="mb-4">

                        Billing Details

                    </h3>

                    <form id="checkoutForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>

                                    First Name

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>

                                    Last Name

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-12 mb-3">

                                <label>

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-12 mb-3">

                                <label>

                                    Mobile Number

                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-12 mb-3">

                                <label>

                                    Address

                                </label>

                                <textarea
                                    class="form-control"
                                    rows="4"
                                    required></textarea>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>

                                    City

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>

                                    PIN Code

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

            <!-- Order Summary starts in Part 2 -->
