<!--========================================
PAYMENT METHODS
=========================================-->

<section class="payment-section py-5">

    <div class="container">

        <div class="checkout-card">

            <h3 class="mb-4">

                Select Payment Method

            </h3>

            <div class="payment-methods">

                <!-- Google Pay -->

                <label class="payment-option">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="Google Pay"
                        checked>

                    <div class="payment-card">

                        <i class="fab fa-google-pay fa-2x"></i>

                        <div>

                            <h5>

                                Google Pay

                            </h5>

                            <small>

                                Fast & Secure Payment

                            </small>

                        </div>

                    </div>

                </label>

                <!-- UPI -->

                <label class="payment-option mt-3">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="UPI">

                    <div class="payment-card">

                        <i class="fas fa-mobile-screen-button fa-2x"></i>

                        <div>

                            <h5>

                                UPI Payment

                            </h5>

                            <small>

                                PhonePe, Paytm, BHIM & Others

                            </small>

                        </div>

                    </div>

                </label>

                <!-- Card -->

                <label class="payment-option mt-3">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="Card">

                    <div class="payment-card">

                        <i class="far fa-credit-card fa-2x"></i>

                        <div>

                            <h5>

                                Credit / Debit Card

                            </h5>

                            <small>

                                Visa, Mastercard, RuPay

                            </small>

                        </div>

                    </div>

                </label>

                <!-- COD -->

                <label class="payment-option mt-3">

                    <input
                        type="radio"
                        name="paymentMethod"
                        value="Cash On Delivery">

                    <div class="payment-card">

                        <i class="fas fa-money-bill-wave fa-2x"></i>

                        <div>

                            <h5>

                                Cash On Delivery

                            </h5>

                            <small>

                                Pay when your order arrives

                            </small>

                        </div>

                    </div>

                </label>

            </div>

            <!-- Security -->

            <div class="alert alert-info mt-4">

                <i class="fas fa-lock me-2"></i>

                All payments are protected with secure SSL encryption.

            </div>

            <!-- Terms -->

            <div class="form-check mt-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="termsCheck"
                    required>

                <label
                    class="form-check-label"
                    for="termsCheck">

                    I agree to the Terms & Conditions and Privacy Policy.

                </label>

            </div>

            <!-- Place Order -->

            <div class="text-center mt-5">

                <button
                    id="placeOrderBtn"
                    class="btn btn-gold btn-lg px-5">

                    <i class="fas fa-lock me-2"></i>

                    Place Secure Order

                </button>

            </div>

        </div>

    </div>

</section>
