<!--========================================
SHOP SECTION
=========================================-->

<section class="shop-section py-5">

    <div class="container">

        <div class="row">

            <!-- FILTER SIDEBAR -->

            <div class="col-lg-3">

                <div class="shop-sidebar">

                    <div class="filter-box mb-4">

                        <h5>Categories</h5>

                        <div class="form-check">

                            <input class="form-check-input category-filter"
                                   type="checkbox"
                                   value="Men"
                                   id="men">

                            <label class="form-check-label"
                                   for="men">

                                Men

                            </label>

                        </div>

                        <div class="form-check">

                            <input class="form-check-input category-filter"
                                   type="checkbox"
                                   value="Women"
                                   id="women">

                            <label class="form-check-label"
                                   for="women">

                                Women

                            </label>

                        </div>

                        <div class="form-check">

                            <input class="form-check-input category-filter"
                                   type="checkbox"
                                   value="Unisex"
                                   id="unisex">

                            <label class="form-check-label"
                                   for="unisex">

                                Unisex

                            </label>

                        </div>

                    </div>

                    <div class="filter-box mb-4">

                        <h5>Brands</h5>

                        <select class="form-select"
                                id="brandFilter">

                            <option value="">All Brands</option>

                            <option>Gucci</option>

                            <option>Prada</option>

                            <option>Dior</option>

                            <option>Armani</option>

                            <option>Tom Ford</option>

                            <option>Creed</option>

                            <option>Zara</option>

                        </select>

                    </div>

                    <div class="filter-box mb-4">

                        <h5>Price</h5>

                        <input type="range"
                               class="form-range"
                               id="priceRange"
                               min="1000"
                               max="30000"
                               value="30000">

                        <p class="mt-2">

                            Max Price:
                            <strong id="priceValue">

                                ₹30,000

                            </strong>

                        </p>

                    </div>

                </div>

            </div>

            <!-- PRODUCT AREA -->

            <div class="col-lg-9">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h4>

                        Luxury Collection

                    </h4>

                    <select class="form-select w-auto"
                            id="sortProducts">

                        <option value="default">

                            Sort By

                        </option>

                        <option value="price-low">

                            Price: Low to High

                        </option>

                        <option value="price-high">

                            Price: High to Low

                        </option>

                        <option value="name">

                            Name

                        </option>

                        <option value="rating">

                            Rating

                        </option>

                    </select>

                </div>

                <!-- Products will be rendered here -->

                <div class="row g-4"
                     id="productGrid">

                </div>

            </div>

        </div>

    </div>

</section>
